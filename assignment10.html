<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 10 Output</title>
    <style>
        body {
            font-family: "Times New Roman", Times, serif;
            margin: 15px;
        }

        h3 {
            font-size: 13px;
            font-weight: bold;
            margin: 10px 0 6px 0;
        }

        .img-box {
            display: inline-block;
            width: 85px;
            height: 85px;
            border: 1px solid #d0d0d0;
            padding: 4px;
            font-size: 11px;
            color: #1a73e8;
            box-sizing: border-box;
        }

        video {
            width: 220px;
            height: 130px;
            display: block;
            margin-bottom: 6px;
            background-color: #000000;
            object-fit: cover;
        }

        audio {
            width: 220px;
            height: 32px;
            display: block;
            margin-bottom: 6px;
        }

        iframe {
            width: 220px;
            height: 130px;
            border: 1px solid #cccccc;
            display: block;
        }
    </style>
</head>
<body>

    <h3>Image</h3>
    <img src="https://picsum.photos/85/85" alt="College campus" class="img-box">

    <h3>Video</h3>
    <video src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" controls preload="metadata"></video>

    <h3>Audio</h3>
    <audio src="https://interactive-examples.mdn.mozilla.net/media/cc0-audio/t-rex-roar.mp3" controls preload="metadata"></audio>

    <h3>YouTube</h3>
    <iframe src="https://www.youtube.com/embed/tgbNymZ7vqY" title="YouTube video player" allowfullscreen></iframe>

</body>
</html>
